name = "mwar-api-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
account_id = "00a674bee4124645524f4aabe22ac68c"
workers_dev = false

routes = [
  { pattern = "api.mwar.win", custom_domain = true }
]

[vars]
DEV_MOCK_MODE = "true"
LOG_RECEIVER_URL = "https://logs.mwar.win/api/logs"

# 1. Core D1 Database (Users, Wallets, MLM Trees, Market, Withdrawals, Daily Quests)
[[d1_databases]]
binding = "DB"
database_name = "core_db"
database_id = "3c539f8e-7a45-4415-9b72-d335787e15f0"
migrations_dir = "migrations/core_db"

# 2. Chat D1 Database (Monthly rotating table chat_YYYY_MM)
[[d1_databases]]
binding = "CHAT_DB"
database_name = "chat_2026_11"
database_id = "4b626ea0-91ab-4266-ae22-8f6fbfb61190"
migrations_dir = "migrations/chat_2026_11"

# 3. Cloudflare Queues Producer (Financial Log Buffer)
[[queues.producers]]
binding = "LOG_QUEUE"
queue = "mwar-financial-logs"

# 4. Queue consumer: forwards logs to logs.mwar.win; failed deliveries are retried (queue keeps
#    messages up to 4 days / 345600 seconds on standard Cloudflare plans)
[[queues.consumers]]
queue = "mwar-financial-logs"
max_batch_size = 50
max_batch_timeout = 5
max_retries = 100

# 5. Midnight UTC (07:00 Bangkok): daily MLM settlement + marketplace escrow release
[triggers]
crons = ["0 0 * * *"]


# 6. R2: 90-day PostgreSQL log archives (logs_YYYY_MM.jsonl.gz) uploaded by the Mini PC log receiver
#    Create once: npx wrangler r2 bucket create mwar-audit-archive
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "mwar-audit-archive"
