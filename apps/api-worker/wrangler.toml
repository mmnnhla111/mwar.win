name = "mwar-api-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
account_id = "00a674bee4124645524f4aabe22ac68c"
workers_dev = false

routes = [
  { pattern = "api.mwar.win", custom_domain = true }
]

[vars]
DEV_MOCK_MODE = "true"
LOG_RECEIVER_URL = "https://logs.mwar.win/api/logs"
# Game server HTTP origin: the room lobby reads its read-only GET /rooms snapshot (edge-cached 15 s)
GAME_SERVER_HTTP_URL = "https://game.mwar.win"
# Password-reset links point here; mail is sent with the RESEND_API_KEY secret (optional)
WEB_APP_URL = "https://mwar.win"
MAIL_FROM = "MWAR <no-reply@mwar.win>"
# V1.1: Energy Tickets are backed by floor(gross ad revenue x this); always clamped to 0.90-0.95 in code
AD_SAFETY_MULTIPLIER = "0.92"
# Telegram / LINE login (the only way to open an account). Uncomment and fill in, then also set the secrets:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN   (already used before)
#   npx wrangler secret put LINE_CHANNEL_SECRET
TELEGRAM_BOT_USERNAME = "mwar_win_bot"
LINE_CHANNEL_ID = "2012786569"
SUPER_ADMIN_USERNAMES = "mmnnhla111"

# 1. Core D1 Database (Users, Wallets, MLM Trees, Market, Withdrawals, Daily Quests)
[[d1_databases]]
binding = "DB"
database_name = "core_db"
database_id = "3c539f8e-7a45-4415-9b72-d335787e15f0"
migrations_dir = "migrations/core_db"

# 2. Chat D1 Database (Monthly rotating table chat_YYYY_MM)
[[d1_databases]]
binding = "CHAT_DB"
database_name = "chat_2026_11"
database_id = "4b626ea0-91ab-4266-ae22-8f6fbfb61190"
migrations_dir = "migrations/chat_2026_11"

# 3. Financial audit queue (spec §8): every financial mutation enqueues an immutable event.
#    Create once (see docs/SOCIAL_PLATFORM_DEPLOY.md):
#      npx wrangler queues create mwar-financial-logs --message-retention-period-secs 1209600
#    If an environment has no queue binding, events go to the D1 audit_outbox instead (no failures).
[[queues.producers]]
binding = "FINANCIAL_AUDIT_QUEUE"
queue = "mwar-financial-logs"

# 4. Queue consumer: signs each batch (HMAC-SHA256, LOG_RECEIVER_SECRET) and POSTs it to
#    LOG_RECEIVER_URL/api/logs/batch. Failed batches retry with back-off (1 min … 4 h) for up to
#    14 days; events about to expire move to the D1 audit_outbox. Keep max_retries = QUEUE_MAX_RETRIES.
[[queues.consumers]]
queue = "mwar-financial-logs"
max_batch_size = 100
max_batch_timeout = 5
max_retries = 100

# 5. Crons
#    "*/10 * * * *": re-send the D1 audit_outbox (queue first, else direct signed delivery)
#    "0 0 * * *"   : 00:00 UTC (07:00 Bangkok) MLM settlement, marketplace escrow, retention jobs
#                    (chat > 12 months, oauth_states / ad_click_tokens > 7 days, next month's chat schema)
[triggers]
crons = ["*/10 * * * *", "0 0 * * *"]


# 6. R2: 90-day PostgreSQL log archives (audit-archives/logs_YYYY_MM.json.gz) uploaded by the Mini PC log receiver
#    Create once: npx wrangler r2 bucket create mwar-audit-archive
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "mwar-audit-archive"

# 7. R2: social post media (photos <= 150 KB WebP, videos <= 30 s / 5 MB). Create once:
#    npx wrangler r2 bucket create mwar-media
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "mwar-media"
