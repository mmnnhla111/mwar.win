<svg width="400" height="220" viewBox="0 0 400 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgFast" x1="0" y1="0" x2="400" y2="220" gradientUnits="userSpaceOnUse">
      <stop stopColor="#1E1B4B"/>
      <stop offset="0.5" stopColor="#4A044E"/>
      <stop offset="1" stopColor="#C026D3"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0" y1="0" x2="1" y2="1">
      <stop stopColor="#E879F9"/>
      <stop offset="1" stopColor="#A855F7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" rx="16" fill="url(#bgFast)"/>
  <!-- Neon Speed Lines -->
  <path d="M180 20L150 200M240 10L200 210M300 0L250 220M360 10L310 210" stroke="#F472B6" stroke-opacity="0.25" stroke-width="2"/>
  <!-- Lightning Bolt Energy Core -->
  <polygon points="320,30 260,110 300,110 270,190 350,95 305,95" fill="#F472B6" stroke="#FDF2F8" stroke-width="2"/>
  <!-- Content -->
  <rect x="24" y="24" width="76" height="24" rx="12" fill="#A21CAF"/>
  <text x="62" y="40" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="900" font-family="system-ui, sans-serif">SPEED RUN</text>
  <text x="24" y="90" fill="#FFFFFF" font-size="24" font-weight="900" font-family="system-ui, sans-serif">FAST & MINI MODE</text>
  <text x="24" y="116" fill="#F5D0FE" font-size="13" font-weight="500" font-family="system-ui, sans-serif">Instant respawns, turbo energy tickets & fast loot.</text>
  <text x="24" y="136" fill="#E879F9" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Energy Cost: 1 EC • Double Daily Quest EXP</text>
  <!-- CTA Badge -->
  <rect x="24" y="160" width="120" height="36" rx="8" fill="url(#accentPurple)"/>
  <text x="84" y="183" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="800" font-family="system-ui, sans-serif">BLITZ PLAY</text>
</svg>