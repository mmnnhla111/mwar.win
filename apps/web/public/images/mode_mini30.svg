<svg width="400" height="220" viewBox="0 0 400 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgMini" x1="0" y1="0" x2="400" y2="220" gradientUnits="userSpaceOnUse">
      <stop stopColor="#0F172A"/>
      <stop offset="0.5" stopColor="#1E293B"/>
      <stop offset="1" stopColor="#0284C7"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="1">
      <stop stopColor="#38BDF8"/>
      <stop offset="1" stopColor="#0284C7"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="220" rx="16" fill="url(#bgMini)"/>
  <!-- Tactical Grid Lines -->
  <path d="M0 40H400M0 80H400M0 120H400M0 160H400" stroke="#38BDF8" stroke-opacity="0.1" stroke-width="1"/>
  <path d="M80 0V220M160 0V220M240 0V220M320 0V220" stroke="#38BDF8" stroke-opacity="0.1" stroke-width="1"/>
  <!-- Stylized Combat Elements -->
  <circle cx="310" cy="110" r="70" stroke="#0284C7" stroke-width="3" stroke-opacity="0.4"/>
  <circle cx="310" cy="110" r="45" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="310" y1="30" x2="310" y2="190" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="230" y1="110" x2="390" y2="110" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.6"/>
  <polygon points="310,80 325,110 310,140 295,110" fill="#38BDF8" fill-opacity="0.3"/>
  <!-- Content -->
  <rect x="24" y="24" width="76" height="24" rx="12" fill="#0284C7"/>
  <text x="62" y="40" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="900" font-family="system-ui, sans-serif">30 PLAYERS</text>
  <text x="24" y="90" fill="#FFFFFF" font-size="24" font-weight="900" font-family="system-ui, sans-serif">30-PLAYER SKIRMISH</text>
  <text x="24" y="116" fill="#94A3B8" font-size="13" font-weight="500" font-family="system-ui, sans-serif">Rapid tactical combat in tight urban arena.</text>
  <text x="24" y="136" fill="#38BDF8" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Avg Duration: 3 - 5 Mins • 15s Chest Drops</text>
  <!-- CTA Badge -->
  <rect x="24" y="160" width="120" height="36" rx="8" fill="url(#accentCyan)"/>
  <text x="84" y="183" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="800" font-family="system-ui, sans-serif">DEPLOY NOW</text>
</svg>