# LEGACY: mwar.win used to be served by this Worker. Static hosting moved to Cloudflare Pages
# (project "mwar-web", see docs/CLOUDFLARE_PAGES_MIGRATION.md). Renamed so a habitual
# `npx wrangler deploy` in apps/web cannot re-claim the mwar.win custom domains from Pages.

name = "mwar-web"
main = "worker.js"
compatibility_date = "2024-11-01"
account_id = "00a674bee4124645524f4aabe22ac68c"
workers_dev = false

routes = [
  { pattern = "mwar.win", custom_domain = true },
  { pattern = "www.mwar.win", custom_domain = true }
]

[assets]
directory = "./out"
binding = "ASSETS"
